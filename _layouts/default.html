<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="masthead">
    <div class="wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">EcoWestern Short and Cheap Benchmark</p>
      <nav aria-label="Site">
        <a href="{{ '/' | relative_url }}">Overview</a>
        <a href="{{ '/benchmarks/gi.html' | relative_url }}">ESAC-GI</a>
        <a href="{{ '/benchmarks/ag.html' | relative_url }}">ESAC-AG</a>
        <a href="{{ '/specs/spec.html' | relative_url }}">Specification</a>
        <a href="{{ '/CHANGELOG.html' | relative_url }}">Changelog</a>
        <a href="https://github.com/EcoWestern/ESAC">Source</a>
      </nav>
    </div>
  </header>

  <main id="content" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        ESAC is published by EcoWestern under the MIT licence.
        The specification is normative; everything else here is explanation.
      </p>
    </div>
  </footer>
</body>
</html>
