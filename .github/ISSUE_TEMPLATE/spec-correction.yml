name: Specification correction
description: A clause is ambiguous, contradictory, or not implementable as written
title: "[spec] "
body:
  - type: markdown
    attributes:
      value: |
        A clause that can be read two ways is the most useful report this repository can
        receive, because two readings produce two different scores.

        Check the [specification](https://github.com/EcoWestern/ESAC/blob/main/specs/spec.md)
        first: amendments exist precisely to resolve clauses that were unclear, and a clause
        that Part II already supersedes is not a defect.

  - type: input
    id: section
    attributes:
      label: Section
      description: The section number, or the heading if it is in Part I.
      placeholder: Part II section 4
    validations:
      required: true

  - type: textarea
    id: clause
    attributes:
      label: The clause, quoted
      description: Paste the wording at issue, so the report is unambiguous about what it refers to.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong with it
      description: If it can be read two ways, give both readings and say which one the suites assume.
    validations:
      required: true

  - type: textarea
    id: consequence
    attributes:
      label: What a correction would change
      description: |
        Say whether this would change what a score measures. If it would, it is a major-version
        change for the affected suite and the decision has to be made deliberately, so name the
        consequence rather than leaving it implied.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I checked that no existing amendment already resolves this.
          required: true
        - label: I have not pasted a held-out seed, a scoring key, or private evaluation material.
          required: true
