name: Pages

# Builds the documentation site from the same Markdown the repository renders, so there is
# one copy of every document rather than a site copy that drifts from it. The internal link
# check runs before the build, because a broken link in the specification is a defect in the
# normative document rather than a cosmetic problem.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check internal links
        run: node tools/check-links.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
